    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-06d3fa86-a021.cloud.databricks.com
    variables:
      catalog: rail_punctuality_project
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-06d3fa86-a021.cloud.databricks.com      
      root_path: /Workspace/Users/beatrizcruzjover@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: rail_punctuality_project
      schema: prod
    permissions:
      - user_name: beatrizcruzjover@gmail.com
        level: CAN_MANAGE
