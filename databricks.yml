bundle:
  name: belgian_rail_punctuality_project
  uuid: b386d1e9-da07-4f98-a186-689137ff215e

include:
  - resources/*.yml

sync:
  exclude:
    - .git/
    - .pytest_cache/
    - "**/__pycache__/"
    - .venv/

# Variable declarations. These variables are assigned in the dev/prod targets below.
