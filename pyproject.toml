[project]
name = "belgian_rail_punctuality_project"
version = "0.0.1"
authors = [{ name = "Beatriz Cruz Jover" }]
requires-python = ">=3.10,<3.13"
dependencies = [
 "pyspark",
 "delta-spark",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/rail"]

[tool.ruff]
line-length = 120
